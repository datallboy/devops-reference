global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 127.0.0.1:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 192.168.77.1:9090

  - job_name: linux_nodes
    static_configs:
      - targets:
          - lab-debian01:9100
          - lab-rocky01:9100

    relabel_configs:
      - source_labels:
          - __address__
        regex: '([^:]+):.*'
        target_label: host
        replacement: '$1'
